# Development stack: hot-reload API + worker + Postgres + Redis (+ optional beat).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: dentalsaas
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dentalsaas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:adminpassword@db:5432/dentalsaas
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: ["./app:/app/app", "./worker:/app/worker"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:adminpassword@db:5432/dentalsaas
      REDIS_URL: redis://redis:6379/0
    volumes: ["./app:/app/app", "./worker:/app/worker"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Periodic cache refresh — enable if you want nightly re-scrapes.
  # beat:
  #   build: { context: ., dockerfile: Dockerfile.worker }
  #   command: celery -A worker.celery_app beat --loglevel=info
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgresql+psycopg2://admin:adminpassword@db:5432/dentalsaas
  #     REDIS_URL: redis://redis:6379/0
  #   depends_on: { redis: { condition: service_healthy } }

volumes:
  pgdata:
