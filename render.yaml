# Render Blueprint — backend do Instrumenta (opcional: o app funciona 100% em modo demo sem ele).
# Como usar: no Render, "New +" → "Blueprint" → aponte para o repositório.
# Depois preencha CORS_ORIGINS com a URL do seu frontend na Vercel.
databases:
  - name: instrumenta-db
    databaseName: instrumenta
    plan: free

services:
  # Cache/fila (Celery) — Redis gerenciado
  - type: redis
    name: instrumenta-redis
    plan: free
    ipAllowList: []          # apenas serviços internos do Render acessam

  # API FastAPI
  - type: web
    name: instrumenta-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.api
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: prod
      - key: DEMO_MODE
        value: "false"       # auth JWT real: endpoints protegidos exigem token (sem fallback demo)
      - key: SCRAPER_MODE
        value: mock          # marketplaces bloqueiam scraping (403); mantenha mock
      - key: DATABASE_URL
        fromDatabase: { name: instrumenta-db, property: connectionString }
      - key: REDIS_URL
        fromService: { name: instrumenta-redis, type: redis, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://instrumenta-amber.vercel.app   # URL real do frontend na Vercel
      - key: ANTHROPIC_API_KEY
        sync: false          # opcional (OCR/padronização por IA); deixe em branco p/ usar o matcher local
      - key: LLM_MODEL
        value: claude-sonnet-5   # modelo de visão p/ o OCR; troque p/ claude-haiku-4-5-20251001 se quiser mais barato

  # OBS: o worker Celery (Dockerfile.worker) foi removido do blueprint porque o
  # plano free do Render não permite "background worker". Como SCRAPER_MODE=mock e
  # o frontend já calcula preços localmente, o worker não é necessário agora.
  # Para reativar (plano pago), reponha um bloco `- type: worker` apontando p/
  # ./backend/Dockerfile.worker com DATABASE_URL + REDIS_URL.
